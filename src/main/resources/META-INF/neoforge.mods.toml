modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"

[[mods]]
modId = "vidlib"
version = "${version}"
displayName = "VidLib"
authors = "latvian.dev"
iconFile = "vidlib_logo.png"

[[dependencies.vidlib]]
modId = "neoforge"
type = "required"
versionRange = "[26.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.vidlib]]
modId = "imguiresources"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.vidlib]]
modId = "iris"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# NOTE: KLib is jarJar'd into the mod (see build.gradle) and ships its own mixin config,
# access transformer entries and MC-interface injections through the artifact metadata.
# The `[[mixins]]` block for it is therefore not declared here.

[[mixins]]
config = "vidlib.mixins.json"
