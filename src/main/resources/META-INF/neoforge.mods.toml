modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"

[[mods]]
modId = "vidlib"
version = "${version}"
displayName = "VidLib"
authors = "latvian.dev"
iconFile = "vidlib_logo.png"

[[dependencies.vidlib]]
modId = "neoforge"
type = "required"
versionRange = "[26.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.vidlib]]
modId = "imguiresources"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.vidlib]]
modId = "iris"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "vidlib.common.mixins.json"

[[mixins]]
config = "vidlib.client.mixins.json"

[[mixins]]
config = "vidlib.neoforge.mixins.json"

[[mixins]]
config = "vidlib.voicechat.mixins.json"
requiredMods = ["voicechat"]