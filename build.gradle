import groovy.json.JsonSlurper

import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse
import java.security.MessageDigest

plugins {
	id 'base'
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev' version '2.0.148'
	id 'idea'
}

var ENV = System.getenv() + (file('.env').exists() ? file('.env').readLines().findAll { it && !it.startsWith('#') }.collectEntries {
	def (k, v) = it.split('=', 2); [(k.trim()): v.trim()]
} : [:])

var CI = ENV.CI == "true"

var localBuildFile = new File(project.rootDir, "build.txt")
var localBuildNumber = localBuildFile.getText("UTF-8").toInteger() + 1

version = "$mod_version-build.$localBuildNumber"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

println("Building version: $version")

neoForge {
	enable {
		version = project.neoforge_version
		validateAccessTransformers = !CI
		disableRecompilation = CI

		accessTransformers {
			publish(project.file('src/main/resources/META-INF/accesstransformer.cfg'))
		}

		interfaceInjectionData {
			from(file('interfaces.json'))
			publish(file('interfaces.json'))
		}

		runs {
			configureEach {
				logLevel = org.slf4j.event.Level.INFO
			}

			client {
				ideName = 'Client'
				client()
				systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

				if (ENV.MC_CLIENT_ARGS) {
					programArguments.addAll(ENV.MC_CLIENT_ARGS.split(' '))
				}

				jvmArguments.addAll("-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition")
				gameDirectory = file 'runs/client'
			}

			client2 {
				ideName = 'Client 2'
				client()
				systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

				if (ENV.MC_CLIENT_2_ARGS) {
					programArguments.addAll(ENV.MC_CLIENT_2_ARGS.split(' '))
				}

				jvmArguments.addAll("-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition")
				gameDirectory = file 'runs/client'
			}

			server {
				ideName = 'Server'
				server()
				programArgument("--nogui")
				gameDirectory = file 'runs/server'
			}
		}

		mods {
			mod {
				sourceSet sourceSets.main
			}
		}
	}
}

compileJava {
	options.encoding = "UTF-8"
	options.release.set(25)
	options.compilerArgs << '-parameters' << '-Xmaxerrs' << '1000'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = targetCompatibility = '25'
	withSourcesJar()
	withJavadocJar()
}

configurations {
	runtimeClasspath.extendsFrom localRuntime
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
	options.addStringOption('Xdoclint:none', '-quiet')
}

repositories {
	mavenLocal()
	mavenCentral()

	maven {
		url "https://maven.neoforged.net/releases"
	}

	if (ENV.MBG_MAVEN_URL) {
		maven {
			url = ENV.MBG_MAVEN_URL
			content {
				includeGroup "com.geckolib"
				includeGroup "software.bernie.geckolib"
				includeGroup "dev.latvian.mods"
				includeGroup "dev.latvian.apps"
				includeGroup "dev.beast.mods"
				includeGroup "maven.modrinth"
			}

			credentials {
				username = ENV.MBG_MAVEN_USERNAME
				password = ENV.MBG_MAVEN_PASSWORD
			}
		}
	}

	// Leave in the repositories below due to public repository of Vidlib

	maven {
		url = 'https://maven.latvian.dev/releases'
		content {
			includeGroup "dev.latvian.mods"
			includeGroup "dev.latvian.apps"
		}
	}

	maven {
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup "maven.modrinth"
		}
	}

	maven {
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroup "software.bernie.geckolib"
			includeGroup "com.geckolib"
		}
	}
}

dependencies {
	jarJar(implementation('dev.latvian.mods:klib')) {
		version {
			strictly "[$klib_version,)"
			prefer "$klib_version"
		}
	}

	jarJar(implementation('dev.latvian.mods:better-advanced-tooltips')) {
		version {
			strictly "[$bat_version,)"
			prefer "$bat_version"
		}
	}

	jarJar(implementation('dev.latvian.apps:tiny-http')) {
		version {
			strictly "[$tiny_http_version,)"
			prefer "$tiny_http_version"
		}
	}

	accessTransformers("dev.latvian.mods:klib:$klib_version")
	interfaceInjectionData("dev.latvian.mods:klib:$klib_version")

	compileOnly("maven.modrinth:G922NeHS:fB0LmHnR") // watermedia:2.1.37
	// compileOnly("maven.modrinth:G922NeHS:FdCZ5Rxq") // watermedia:3.0.0.23 // Fixes linux and mac but conflicts with flashback

	compileOnly('com.github.luben:zstd-jni:1.5.7-7')
	compileOnly("dev.latvian.mods:imgui-resources:$imgui_resources_version")
	compileOnly("maven.modrinth:simple-voice-chat:$simple_voice_chat_version")
	compileOnly("maven.modrinth:iris:$iris_version")
	compileOnly("com.geckolib:geckolib-neoforge-$minecraft_version:$geckolib_version")
}

processResources {
	def toReplace = [
			"version"         : project.version,
			"geckolib_version": project.geckolib_version
	]

	println("[Process Resources] Replacing properties in resources: " + toReplace)

	inputs.properties toReplace

	filesMatching("META-INF/neoforge.mods.toml") {
		expand toReplace
	}

	filesMatching("ignite.mod.json") {
		expand toReplace
	}
}

jar {
	manifest {
		attributes([
				"Specification-Title"     : project.mod_id,
				"Specification-Vendor"    : project.mod_author,
				"Specification-Version"   : "1",
				"Implementation-Title"    : project.name,
				"Implementation-Version"  : version,
				"Implementation-Vendor"   : project.mod_author,
				"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}

tasks.register('buildResourcePack', Zip) {
	group "build"
	description "Builds a resource pack from assets"
	dependsOn tasks.named('processResources')
	into('/')

	from('src/main/resources') {
		include 'assets/**'
		include 'pack.mcmeta'
		exclude '**/.DS_Store', '**/Thumbs.db'
		exclude 'assets/*/particles/**'
		exclude 'assets/*/shaders/**'
		exclude 'assets/*/post_effect/**'
		exclude 'assets/*/vidlib/canvas/**'
	}

	from('src/main/resources') {
		include 'vidlib_logo.png'
		rename { fileName ->
			fileName == 'vidlib_logo.png' ? 'pack.png' : fileName
		}
	}

	destinationDirectory = layout.buildDirectory.dir('libs')
	archiveBaseName.set(project.archives_base_name)
	archiveVersion.set(project.version.toString())
	archiveClassifier.set('resource-pack')

	preserveFileTimestamps = false
	reproducibleFileOrder = true
	duplicatesStrategy = DuplicatesStrategy.WARN
}

tasks.build {
	dependsOn tasks.buildResourcePack
}

def igniteClassExcludes = [
		'dev/latvian/mods/vidlib/core/mixin/client/**',
		'dev/latvian/mods/vidlib/core/mixin/neoforge/**',
		'dev/latvian/mods/vidlib/core/mixin/lithium/**',
		'dev/latvian/mods/vidlib/core/mixin/mod/**',
		'dev/latvian/mods/klib/core/mixin/client/**',
		'dev/latvian/mods/klib/core/mixin/neoforge/**'
]

def igniteDependencyJar = { String group, String module ->
	configurations.runtimeClasspath.incoming.artifactView {
		componentFilter { id ->
			id instanceof ModuleComponentIdentifier && id.group == group && id.module == module
		}
	}.files.elements.map { it.first().asFile }
}

tasks.register('buildIgniteJar', Jar) {
	group "build"
	description "Builds an Ignite mixins jar"
	dependsOn tasks.named('processResources')
	into('/')

	from(sourceSets.main.output) {
		include 'dev/latvian/mods/vidlib/**', 'dev/latvian/mods/replay/**', 'dev/mrbeastgaming/**'
		include 'ignite.mod.json', 'vidlib.accesswidener', 'vidlib.common.mixins.json', 'vidlib.bukkit.mixins.json'
		exclude igniteClassExcludes
	}

	from(zipTree(igniteDependencyJar('dev.latvian.mods', 'klib'))) {
		include 'dev/latvian/mods/klib/**', 'klib.common.mixins.json', 'klib.bukkit.mixins.json'
		exclude igniteClassExcludes
	}

	from(zipTree(igniteDependencyJar('dev.latvian.apps', 'tiny-http'))) {
		include 'dev/latvian/apps/**'
	}

	from(zipTree(igniteDependencyJar('com.github.luben', 'zstd-jni'))) {
		exclude 'META-INF/**', 'module-info.class'
	}

	destinationDirectory = layout.buildDirectory.dir('libs')
	archiveBaseName.set(project.archives_base_name)
	archiveVersion.set(project.version.toString())
	archiveClassifier.set('ignite')

	manifest {
		attributes("Implementation-Version": project.version)
	}

	preserveFileTimestamps = false
	reproducibleFileOrder = true
	duplicatesStrategy = DuplicatesStrategy.WARN
}

tasks.build {
	dependsOn tasks.buildIgniteJar
}

def igniteRunDir = file("runs/ignite")
def igniteModsDir = new File(igniteRunDir, "mods")
def igniteLauncherJar = new File(igniteRunDir, "ignite.jar")
def ignitePaperJar = new File(igniteRunDir, "paper.jar")
def igniteMinecraftVersion = project.minecraft_version
def httpClient = HttpClient.newBuilder().followRedirects(HttpClient.Redirect.NORMAL).build()

def httpGet = { String url ->
	def response = httpClient.send(HttpRequest.newBuilder(URI.create(url)).GET().build(), HttpResponse.BodyHandlers.ofString())
	if (response.statusCode() != 200) throw new GradleException("Failed to read ${url}: HTTP ${response.statusCode()}")
	response.body()
}

def httpDownload = { String url, File to ->
	to.parentFile.mkdirs()
	def response = httpClient.send(HttpRequest.newBuilder(URI.create(url)).GET().build(), HttpResponse.BodyHandlers.ofFile(to.toPath()))
	if (response.statusCode() != 200) {
		to.delete()
		throw new GradleException("Failed to download ${url}: HTTP ${response.statusCode()}")
	}
}

def sha256 = { File file ->
	HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256").digest(file.bytes))
}

tasks.register('downloadIgniteLauncher') {
	group "run"
	description "Downloads the Ignite launcher into ${igniteRunDir}"
	inputs.property "igniteVersion", project.ignite_version
	outputs.file igniteLauncherJar

	doLast {
		httpDownload("https://github.com/vectrix-space/ignite/releases/download/v${project.ignite_version}/ignite.jar", igniteLauncherJar)
	}
}

tasks.register('downloadPaperServerJar') {
	group "run"
	description "Downloads the latest Paper build for Minecraft ${igniteMinecraftVersion} into ${igniteRunDir}"
	outputs.file ignitePaperJar
	outputs.upToDateWhen { false }

	doLast {
		def build = new JsonSlurper().parseText(httpGet("https://fill.papermc.io/v3/projects/paper/versions/${igniteMinecraftVersion}/builds/latest"))
		def download = build.downloads["server:default"]

		if (!ignitePaperJar.exists() || sha256(ignitePaperJar) != download.checksums.sha256) {
			httpDownload(download.url, ignitePaperJar)
		}

		println("Paper ${igniteMinecraftVersion} build ${build.id}: ${download.name} (${download.size} bytes)")
	}
}

tasks.register('setupIgniteRun', Copy) {
	group "run"
	description "Sets up the Ignite Paper test run in ${igniteRunDir}"
	dependsOn tasks.downloadIgniteLauncher, tasks.downloadPaperServerJar

	from tasks.named('buildIgniteJar')
	into igniteModsDir

	doFirst {
		igniteModsDir.listFiles()?.findAll { it.name.endsWith("-ignite.jar") }?.each { it.delete() }
		new File(igniteRunDir, "eula.txt").setText("eula=true", "UTF-8")
	}
}

tasks.register('runIgniteServer', Exec) {
	group "run"
	description "Runs a Paper ${igniteMinecraftVersion} server through Ignite with the built Ignite mixin jar"
	dependsOn tasks.setupIgniteRun

	workingDir = igniteRunDir
	executable = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.get().executablePath.toString()
	args "-jar", igniteLauncherJar.absolutePath, "nogui"
}

publishing {
	publications {
		mavenNeoForge(MavenPublication) {
			artifactId = archives_base_name
			from components.java

			artifact(tasks.named('buildResourcePack')) {
				classifier 'resource-pack'
				extension 'zip'
			}

			artifact(tasks.named('buildIgniteJar')) {
				classifier 'ignite'
				extension 'jar'
			}
		}
	}

	repositories {
		if (ENV.MBG_PUBLISH_MAVEN_URL && ENV.MBG_PUBLISH_MAVEN_USERNAME && ENV.MBG_PUBLISH_MAVEN_PASSWORD) {
			maven {
				url = ENV.MBG_PUBLISH_MAVEN_URL
				credentials {
					username = ENV.MBG_PUBLISH_MAVEN_USERNAME
					password = ENV.MBG_PUBLISH_MAVEN_PASSWORD
				}
			}
		}
	}
}

